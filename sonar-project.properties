# SonarQube Cloud: https://sonarcloud.io/project/overview?id=bieli_IoText-rs
# Analysis runs in CI (.github/workflows/sonarcloud.yml). Automatic Analysis must be
# disabled in the SonarQube Cloud project, otherwise the CI scan is rejected.
sonar.projectKey=bieli_IoText-rs
sonar.organization=bieli
sonar.projectName=IoText-rs
# sonar.projectVersion is passed by the workflow from Cargo.toml.

sonar.sourceEncoding=UTF-8
# The whole project is analyzed by default (new analysis scope); only exclusions apply.
sonar.exclusions=target/**,fuzz/**

# Rust reports generated by the workflow before the scan:
#   cargo clippy --all-targets --all-features --message-format=json > target/clippy-report.json
#   cargo llvm-cov --all-features --lcov --output-path target/lcov.info
sonar.rust.clippyReport.reportPaths=target/clippy-report.json
sonar.rust.lcov.reportPaths=target/lcov.info
