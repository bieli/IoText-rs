version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/fuzz", "/demos/wind_turbine"]
    schedule:
      interval: weekly
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
